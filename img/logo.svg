      <stop offset="0%" stop-color="#134E39"/>
      <stop offset="100%" stop-color="#0F5132"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E096"/>
      <stop offset="100%" stop-color="#D4AF37"/>
